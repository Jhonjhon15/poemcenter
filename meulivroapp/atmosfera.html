<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120f14">
  <title>PoemCenter — Atmosfera Poética</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tela-jukebox">
    <!-- Navegação de Retorno -->
    <div class="jukebox-topo-nav">
      <div class="jukebox-links-retorno">
        <a href="index.html" class="link-voltar">← Início</a>
        <a href="home.html" class="link-voltar">← Estante Poética</a>
      </div>
      <div>
        <span class="ornamento" style="font-size: 20px;">❧</span>
      </div>
    </div>

    <!-- Abas no Mobile -->
    <div class="menu-abas">
      <button class="aba-btn ativa" data-aba="coluna-trilha">
        <span class="ornamento">❧</span> Sintonizar Trilha
      </button>
      <button class="aba-btn" data-aba="coluna-pensamentos">
        <span class="icone-svg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
        </span>
        Pensamentos Diários
      </button>
    </div>

    <!-- Conteúdo Principal -->
    <div class="conteudo-atmosfera-grid">
      <!-- Coluna: Trilha Sonora & Vinil -->
      <div id="coluna-trilha" class="coluna-aba">
        <div class="vela-container">
          <div class="chama"></div>
          <div class="corpo-vela"></div>
        </div>

        <div class="vinil-wrap">
          <div class="disco-vinil" id="disco-vinil">
            <div class="centro-vinil"></div>
          </div>
        </div>

        <header class="biblioteca-header" style="margin-bottom: 0;">
          <h1>Atmosfera Poética</h1>
          <p>&ldquo;A música é o perfume da poesia.&rdquo;</p>
        </header>

        <div class="controles-jukebox">
          <button id="btn-play-jukebox" class="btn-primario">
            Ligar Som
          </button>

          <select id="select-jukebox" class="btn-tema" style="padding: 9px 14px;">
            <option value="piano">❧ Piano Clássico</option>
            <option value="lofi">❧ Lo-Fi Chuva</option>
            <option value="bossa">❧ Bossa Nova</option>
            <option value="violao">❧ Violão Acústico</option>
          </select>
        </div>

        <div class="acessibilidade-fonte">
          <button onclick="mudarFonte(1)" class="btn-tema" title="Aumentar Fonte">A+</button>
          <button onclick="mudarFonte(-1)" class="btn-tema" title="Diminuir Fonte">A-</button>
        </div>
      </div>

      <!-- Coluna: Pensamentos Diários -->
      <div id="coluna-pensamentos" class="coluna-aba" style="display: none;">
        <h2 class="titulo-pensamentos">
          <span class="ornamento">❧</span> Pensamentos Diários
        </h2>

        <div class="mural-posts" id="mural-posts"></div>

        <button onclick="window.PoemAtmosfera && window.PoemAtmosfera.adicionarNovoPensamento()" class="btn-secundario" style="margin-top: 10px;">
          + Novo Pensamento
        </button>
      </div>
    </div>
  </div>

  <audio id="audio-jukebox" loop preload="none" src="https://figuringoutmelody.com/wp-content/uploads/adore-you-piano.mp3"></audio>

  <!-- Scripts padrão (compatíveis com file:/// e HTTP) -->
  <script src="./js/icons.js"></script>
  <script src="./js/theme.js"></script>
  <script src="./js/atmosfera.js"></script>
</body>
</html>
